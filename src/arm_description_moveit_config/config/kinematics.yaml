arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  # IK solver timeout: increased from 0.005s to 0.05s.
  # The original 5ms was too short for KDL, causing frequent IK failures
  # and planning timeouts during Cartesian path computation.
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  goal_joint_tolerance: 0.0001
  goal_position_tolerance: 0.0001
  goal_orientation_tolerance: 0.001